services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertops_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/vertops
      - REDIS_URL=redis://redis:6379/0
      - WHATSAPP_PROVIDER=mock
      - AI_PROVIDER=mock
      - STORAGE_PROVIDER=local
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertops_worker
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/vertops
      - REDIS_URL=redis://redis:6379/0
      - WHATSAPP_PROVIDER=mock
      - AI_PROVIDER=mock
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    command: python -m app.workers.scheduler

  postgres:
    image: postgres:16-alpine
    container_name: vertops_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vertops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vertops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
